<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDNERD AI Book Builder - المنصة الأكاديمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #fdfbf7; color: #14532d; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-6">
    <div class="max-w-4xl w-full bg-white p-6 md:p-10 rounded-2xl shadow-xl border border-[#0e7490]/20">
        <!-- Header -->
        <div class="text-center mb-8">
            <span class="bg-[#0e7490]/10 text-[#0e7490] text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">منصة أكاديمية ذكية</span>
            <h1 class="text-3xl md:text-4xl font-bold text-[#0e7490] mt-3 mb-2">MEDNERD AI BOOK BUILDER</h1>
            <p class="text-gray-600 text-sm md:text-base">ارفع ملفك الطبي ليتم تحويله تلقائياً إلى كتاب أكاديمي منسق بتنسيق A4 وخطوط مريحة.</p>
        </div>

        <!-- Main Form Grid -->
        <div class="space-y-6 mb-6">
            <!-- Book Title -->
            <div>
                <label class="block text-sm font-bold text-[#14532d] mb-2">عنوان المحاضرة أو المادة العلمية (باللغة العربية)</label>
                <input type="text" id="bookTitle" placeholder="مثال: CVS Pharmacology - Heart Failure Management" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0e7490] text-sm">
            </div>

            <!-- File Upload Section -->
            <div>
                <label class="block text-sm font-bold text-[#14532d] mb-2">رفع ملف المصدر الطبي</label>
                <div class="border-2 border-dashed border-[#0e7490]/40 rounded-xl p-8 text-center hover:border-[#0e7490] transition-colors bg-[#fdfbf7]/50 cursor-pointer relative">
                    <input type="file" id="sourceFile" accept=".txt,.html,.md" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileSelect(event)">
                    <svg class="mx-auto h-12 w-12 text-[#0e7490] mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p id="fileNameDisplay" class="text-sm font-bold text-[#14532d]">اضغط لاختيار ملف المصدر أو اسحبه إلى هنا</p>
                    <p class="text-xs text-gray-500 mt-1">الرجاء رفع ملفات نصية (.txt) أو مستندات قابلة للقراءة لضمان دقة المحتوى</p>
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <button onclick="generateBook()" class="w-full bg-[#0e7490] hover:bg-[#0b5f75] text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg text-base">
            توليد وتصدير ملف الكتاب الأكاديمي مباشرة 🚀
        </button>
    </div>

    <script>
        let uploadedFileContent = "";
        let uploadedFileName = "";

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadedFileName = file.name.replace(/\.[^/.]+$/, ""); // استخراج اسم الملف بدون اللاحقة
                document.getElementById('fileNameDisplay').innerText = "تم إرفاق الملف بنجاح: " + file.name;
                
                // اقتراح عنوان الكتاب تلقائياً من اسم الملف إذا كان الحقل فارغاً
                const titleInput = document.getElementById('bookTitle');
                if (!titleInput.value) {
                    titleInput.value = uploadedFileName;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedFileContent = e.target.result;
                };
                reader.readAsText(file, 'UTF-8');
            }
        }

        function generateBook() {
            const title = document.getElementById('bookTitle').value || uploadedFileName || "المحاضرة الطبية الأكاديمية";
            
            if(!uploadedFileContent) {
                alert('الرجاء رفع ملف المصدر الطبي أولاً!');
                return;
            }

            // تنظيف النص وتوزيع الفقرات بذكاء
            const paragraphs = uploadedFileContent.split(/\r?\n+/).filter(p => p.trim().length > 0);
            let pagesHTML = '';
            let pageNum = 1;
            
            function createPage(contentHtml, num) {
                return `
                <div class="page-card">
                    <div class="mednerd-header">
                        <span>MEDNERD | ${title}</span>
                        <span>قسم أكاديمي</span>
                    </div>
                    <div class="page-body">
                        ${num === 1 ? `<h1 class="book-title">${title}</h1>` : ''}
                        ${contentHtml}
                    </div>
                    <div class="mednerd-footer">
                        <span>MEDNERD Medical Publishing</span>
                        <span>${num}</span>
                    </div>
                </div>`;
            }

            let pageContent = '';
            paragraphs.forEach((p, index) => {
                // إبراز المصطلحات الإنجليزية باللون الغامق والهايلات
                let formattedP = p.replace(/([A-Z][a-zA-Z]{3,})/g, '<strong class="medical-term">$1</strong>');
                pageContent += `<p class="medical-text">${formattedP}</p>`;
                
                // توزيع كل فقرتين أو ثلاث في صفحة A4 لضمان الراحة البصرية وعدم الحشو
                if ((index + 1) % 3 === 0 || index === paragraphs.length - 1) {
                    pagesHTML += createPage(pageContent, pageNum);
                    pageContent = '';
                    pageNum++;
                }
            });

            const fullHtmlCode = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>${title}</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #fdfbf7; color: #14532d; margin: 0; padding: 0; }
        .page-card { 
            width: 210mm; 
            height: 297mm; 
            max-height: 297mm; 
            box-sizing: border-box;
            overflow: hidden; 
            page-break-after: always; 
            page-break-inside: avoid; 
            padding: 22mm 20mm; 
            background: #ffffff; 
            margin: 10mm auto; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            position: relative; 
        }
        .mednerd-header { border-bottom: 2px solid #0e7490; padding-bottom: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: #0e7490; font-size: 1rem; }
        .mednerd-footer { border-top: 1px solid #e5e7eb; padding-top: 12px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; color: #6b7280; font-weight: 600; }
        .page-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 16px; }
        .book-title { font-size: 1.8rem; font-weight: 900; color: #0e7490; margin-bottom: 10px; line-height: 1.4; border-right: 5px solid #14532d; padding-right: 12px; }
        .medical-text { font-size: 1.15rem; font-weight: 600; color: #1f2937; line-height: 1.9; text-align: justify; }
        .medical-term { font-weight: 900; color: #0e7490; background-color: #f0fbfd; padding: 0 4px; border-radius: 4px; }
        @media print {
            body { background: none; }
            .page-card { margin: 0; box-shadow: none; page-break-after: always; }
        }
    </style>
</head>
<body>
    ${pagesHTML}
</body>
</html>`;

            // تصدير وتحميل الملف فوراً
            const blob = new Blob([fullHtmlCode], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = title.replace(/\s+/g, '_') + '.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert('تم توليد وتحميل ملف الكتاب الأكاديمي بنجاح تام وجاهز للطباعة والتشغيل!');
        }
    </script>
</body>
</html>
