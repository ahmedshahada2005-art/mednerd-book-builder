<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDNERD AI Book Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #fdfbf7; color: #14532d; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-6">
    <div class="max-w-3xl w-full bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-[#0e7490]/20">
        <!-- Header -->
        <div class="text-center mb-6">
            <span class="bg-[#0e7490]/10 text-[#0e7490] text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">منصة أكاديمية ذكية</span>
            <h1 class="text-2xl md:text-3xl font-bold text-[#0e7490] mt-3 mb-2">MEDNERD AI BOOK BUILDER</h1>
            <p class="text-gray-600 text-sm">توليد الكتب الطبية الأكاديمية مع التوزيع الذكي للصفحات، الخطوط المريحة، الهايلات الغامقة، وبنية الصور الجانبية.</p>
        </div>

        <!-- Main Form -->
        <div class="space-y-5">
            <!-- Book Title -->
            <div>
                <label class="block text-sm font-semibold text-[#14532d] mb-1">عنوان المحاضرة أو المادة العلمية باللغة العربية</label>
                <input type="text" id="bookTitle" placeholder="مثال: CVS Pharmacology - Heart Failure" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0e7490] text-sm">
            </div>

            <!-- File Upload Section -->
            <div>
                <label class="block text-sm font-semibold text-[#14532d] mb-1">إرفاق ملف المصدر الطبي (PDF أو نص)</label>
                <div class="border-2 border-dashed border-[#0e7490]/40 rounded-xl p-6 text-center hover:border-[#0e7490] transition-colors bg-[#fdfbf7]/50 cursor-pointer relative">
                    <input type="file" id="sourceFile" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileSelect(event)">
                    <svg class="mx-auto h-10 w-10 text-[#0e7490] mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p id="fileNameDisplay" class="text-xs font-semibold text-gray-700">اضغط لاختيار ملف المصدر أو اسحبه إلى هنا</p>
                </div>
            </div>

            <!-- Medical Source Text -->
            <div>
                <label class="block text-sm font-semibold text-[#14532d] mb-1">أو الصق محتوى المصدر الطبي مباشرة</label>
                <textarea id="sourceText" rows="5" placeholder="الصق النص الطبي هنا مع الحفاظ على المصطلحات الإنجليزية وحالات الـ MCQs..." class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#0e7490] text-sm"></textarea>
            </div>

            <!-- Submit Button -->
            <button onclick="generateBook()" class="w-full bg-[#0e7490] hover:bg-[#0b5f75] text-white font-bold py-3.5 px-6 rounded-xl transition-all shadow-md text-sm">
                بدء توليد الكتاب بتنسيق MEDNERD الاحترافي 🚀
            </button>
        </div>

        <!-- Result / Output Area & Save Section -->
        <div id="outputSection" class="hidden mt-6 pt-6 border-t border-gray-200">
            <h3 class="text-sm font-bold text-[#14532d] mb-2">الكود الناتج وجهات الحفظ:</h3>
            <textarea id="resultCode" readonly rows="6" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-xl text-xs font-mono text-left" dir="ltr"></textarea>
            
            <div class="flex gap-3 mt-3">
                <button onclick="copyCode()" class="flex-1 bg-[#14532d] hover:bg-[#0f3e20] text-white text-xs font-bold py-2.5 px-4 rounded-xl transition-all shadow">
                    نسخ الكود
                </button>
                <button onclick="downloadFile()" class="flex-1 bg-[#b45309] hover:bg-[#92400e] text-white text-xs font-bold py-2.5 px-4 rounded-xl transition-all shadow">
                    حفظ وتنزيل كملف HTML 💾
                </button>
            </div>
        </div>
    </div>

    <script>
        let uploadedFileContent = "";

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileNameDisplay').innerText = "تم إرفاق الملف: " + file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedFileContent = e.target.result;
                };
                reader.readAsText(file);
            }
        }

        function generateBook() {
            const title = document.getElementById('bookTitle').value;
            const text = document.getElementById('sourceText').value || uploadedFileContent;
            
            if(!title) {
                alert('الرجاء إدخال عنوان المادة أولاً.');
                return;
            }
            if(!text) {
                alert('الرجاء إرفاق ملف أو إدخال النص الطبي.');
                return;
            }

            const outputSection = document.getElementById('outputSection');
            const resultCode = document.getElementById('resultCode');
            
            outputSection.classList.remove('hidden');
            
            // قالب HTML الاحترافي المطابق لقواعد MEDNERD (A4، خطوط مريحة، غامق، بدون إيموجي)
            resultCode.value = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>${title}</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #fdfbf7; color: #14532d; font-size: 1.15rem; line-height: 1.9; }
        .page-card { width: 210mm; height: 297mm; max-height: 297mm; overflow: hidden; page-break-after: always; page-break-inside: avoid; padding: 20mm; background: #fff; margin: 10mm auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .mednerd-header { border-bottom: 2px solid #0e7490; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #0e7490; font-size: 0.95rem; }
        .mednerd-footer { border-top: 1px solid #e5e7eb; padding-top: 10px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #6b7280; }
        .content-with-image { display: flex; gap: 20px; align-items: flex-start; margin: 15px 0; break-inside: avoid; }
        .text-content { flex: 1; }
        .image-placeholder { width: 40%; border: 2px dashed #0e7490; border-radius: 12px; padding: 20px; text-align: center; background: #fdfbf7; font-size: 0.85rem; color: #0e7490; font-weight: 600; }
        .clinical-note { background: #fef3c7; border-right: 5px solid #b45309; padding: 12px 16px; margin: 15px 0; border-radius: 8px; font-weight: 600; }
        strong, .bold-term { font-weight: 700; color: #0e7490; }
    </style>
</head>
<body>
    <div class="page-card">
        <div class="mednerd-header">
            <span>MEDNERD | ${title}</span>
            <span>قسم أكاديمي</span>
        </div>
        <div style="flex: 1; overflow: hidden;">
            <h1 class="text-2xl font-bold text-[#0e7490] mb-4">${title}</h1>
            <div class="space-y-4">
                <p class="font-bold text-gray-900">${text}</p>
            </div>
        </div>
        <div class="mednerd-footer">
            <span>MEDNERD Medical Publishing</span>
            <span>1</span>
        </div>
    </div>
</body>
</html>`;
        }

        function copyCode() {
            const resultCode = document.getElementById('resultCode');
            resultCode.select();
            document.execCommand('copy');
            alert('تم نسخ الكود بنجاح!');
        }

        function downloadFile() {
            const code = document.getElementById('resultCode').value;
            const title = document.getElementById('bookTitle').value || 'mednerd-book';
            const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = title.replace(/\s+/g, '_') + '.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
