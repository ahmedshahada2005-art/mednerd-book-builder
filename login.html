<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDNERD AI | تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --med-primary: #1A7398;
      --med-primary-dark: #135875;
      --med-primary-soft: #EBF5F9;
      --med-navy: #0F172A;
      --med-slate: #334155;
      --med-muted: #64748B;
      --med-amber: #C06A23;
      --med-amber-bg: #FFFBEB;
      --med-bg: #F8F9FA;
      --med-card: #FFFFFF;
      --med-box: #F8FAFC;
      --med-border: #E2E8F0;
    }

    [data-theme="dark"] {
      --med-primary: #2292C0;
      --med-primary-dark: #1A7398;
      --med-primary-soft: rgba(26, 115, 152, 0.18);
      --med-navy: #F8FAFC;
      --med-slate: #CBD5E1;
      --med-muted: #94A3B8;
      --med-amber: #E08A3C;
      --med-amber-bg: rgba(192, 106, 35, 0.14);
      --med-bg: #0B1120;
      --med-card: #111827;
      --med-box: #1E293B;
      --med-border: #26334D;
    }

    body {
      font-family: 'Cairo', Tahoma, Arial, sans-serif;
      background-color: var(--med-bg);
      color: var(--med-slate);
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
      background-image:
        radial-gradient(circle at 85% 10%, rgba(26, 115, 152, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 12% 88%, rgba(192, 106, 35, 0.07) 0%, transparent 40%);
    }

    .med-card {
      background-color: var(--med-card);
      border: 1px solid var(--med-border);
      box-shadow: 0 18px 45px -15px rgba(15, 23, 42, 0.08);
    }

    .med-input {
      background-color: var(--med-box);
      border: 1.5px solid var(--med-border);
      color: var(--med-navy);
      transition: all 0.2s ease;
    }

    .med-input:focus {
      outline: none;
      border-color: #1A7398;
      background-color: var(--med-card);
      box-shadow: 0 0 0 3px rgba(26, 115, 152, 0.16);
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    select:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px var(--med-box) inset !important;
      -webkit-text-fill-color: var(--med-navy) !important;
      caret-color: var(--med-navy) !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    .med-btn-primary {
      background: linear-gradient(135deg, #1A7398 0%, #135875 100%);
      color: #FFFFFF;
      box-shadow: 0 10px 22px -5px rgba(26, 115, 152, 0.45);
      transition: all 0.2s ease;
    }

    .med-btn-primary:hover {
      background: linear-gradient(135deg, #1d80a8 0%, #166485 100%);
      transform: translateY(-1px);
    }

    .clinical-pearl {
      border-right: 4px solid #C06A23;
      background-color: var(--med-amber-bg);
      border-top: 1px solid var(--med-border);
      border-bottom: 1px solid var(--med-border);
      border-left: 1px solid var(--med-border);
    }
  </style>
</head>
<body class="flex flex-col justify-between p-4 md:p-6">

  <!-- شريط علوي بهوية MEDNERD Oceanic Clean -->
  <header class="w-full max-w-lg mx-auto pt-1 pb-3 flex items-center justify-between border-b-2 border-[#1A7398]">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl bg-[#1A7398] text-white font-black text-xl flex items-center justify-center shadow-sm tracking-wider">
        M
      </div>
      <div>
        <span class="text-xl font-black text-[#1A7398] tracking-wider block leading-none">MEDNERD</span>
        <span class="text-[10px] font-bold text-[#64748B] tracking-widest uppercase">ACADEMIC MEDICAL AI</span>
      </div>
    </div>

    <button
      type="button"
      onclick="toggleTheme()"
      id="themeToggleBtn"
      class="px-3 py-1.5 rounded-lg text-xs font-extrabold border border-[#E2E8F0] bg-white/80 text-[#0F172A] hover:border-[#1A7398] transition"
    >
      🌙 الوضع الليلي
    </button>
  </header>

  <!-- البطاقة المركزية -->
  <main class="w-full max-w-lg mx-auto my-auto py-5">
    <div class="med-card rounded-2xl p-6 md:p-7">

      <div class="mb-5 pb-3 border-b border-[var(--med-border)] flex items-center justify-between">
        <div>
          <h1 class="text-lg md:text-xl font-black" style="color: var(--med-navy);">
            تسجيل الدخول إلى المنصة
          </h1>
          <p class="text-xs font-semibold mt-0.5" style="color: var(--med-muted);">
            منظومة MEDNERD المتكاملة (32 أداة طبية وتعليمية ذكية)
          </p>
        </div>
        <span class="px-2.5 py-1 rounded-md text-[11px] font-extrabold bg-[#EBF5F9] text-[#1A7398] border border-[#1A7398]/25">
          دخول إلزامي
        </span>
      </div>

      <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl text-xs font-bold leading-relaxed"></div>

      <!-- نموذج تسجيل الدخول المباشر -->
      <form id="loginForm" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-extrabold mb-1" style="color: var(--med-navy);">الاسم الكامل *</label>
            <input
              type="text"
              id="userName"
              required
              placeholder="د. أحمد محمد..."
              class="med-input w-full rounded-xl px-3.5 py-2.5 text-sm font-semibold placeholder-slate-400"
            />
          </div>

          <div>
            <label class="block text-xs font-extrabold mb-1" style="color: var(--med-navy);">البلد / المدينة *</label>
            <input
              type="text"
              id="userCountry"
              required
              placeholder="سوريا، مصر، السعودية..."
              class="med-input w-full rounded-xl px-3.5 py-2.5 text-sm font-semibold placeholder-slate-400"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-extrabold mb-1" style="color: var(--med-navy);">البريد الإلكتروني (Gmail) *</label>
          <input
            type="email"
            id="userEmail"
            required
            placeholder="yourname@gmail.com"
            dir="ltr"
            class="med-input w-full rounded-xl px-4 py-2.5 text-sm font-semibold placeholder-slate-400"
          />
        </div>

        <div>
          <label class="block text-xs font-extrabold mb-1" style="color: var(--med-navy);">الكلية / التخصص أو المؤسسة التعليمية *</label>
          <input
            type="text"
            id="userFaculty"
            required
            placeholder="كلية الطب البشري / الصيدلة / طب الأسنان..."
            class="med-input w-full rounded-xl px-4 py-2.5 text-sm font-semibold placeholder-slate-400"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-extrabold mb-1" style="color: var(--med-navy);">المرحلة الدراسية *</label>
            <select
              id="userLevel"
              class="med-input w-full rounded-xl px-3.5 py-2.5 text-xs font-extrabold"
            >
              <option value="university">جامعي / دراسات عليا (University)</option>
              <option value="secondary">ثانوي / بكالوريا (Secondary)</option>
              <option value="prep">إعدادي / متوسط (Preparatory)</option>
              <option value="primary">ابتدائي (Primary)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-extrabold mb-1" style="color: var(--med-navy);">الصفة الأكاديمية *</label>
            <select
              id="userRole"
              class="med-input w-full rounded-xl px-3.5 py-2.5 text-xs font-extrabold"
            >
              <option value="student">طالب (Student)</option>
              <option value="doctor">طبيب سريري (Clinical Doctor)</option>
              <option value="instructor">محاضر / دكتور جامعي (Instructor)</option>
              <option value="teacher">معلم / مدرس (Teacher)</option>
            </select>
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="med-btn-primary w-full py-3.5 rounded-xl font-black text-sm flex items-center justify-center gap-2 mt-2"
        >
          <span>دخول إلى منصة MEDNERD</span>
          <span>←</span>
        </button>

        <div class="clinical-pearl p-3 rounded-l-xl text-[12px] leading-relaxed mt-3">
          <span class="font-black text-[#C06A23] block text-xs mb-0.5">ملاحظة (Academic Access):</span>
          <span style="color: var(--med-slate);">
            الدخول إجباري لحفظ ملفك الأكاديمي وتخصيص مستوى الشرح في الأدوات الـ 32 حسب مرحلتك وتخصصك.
          </span>
        </div>
      </form>

    </div>
  </main>

  <footer class="w-full max-w-lg mx-auto pt-2 pb-1">
    <div class="border-t border-[var(--med-border)] pt-2 flex justify-between items-center text-[11px] font-bold" style="color: var(--med-muted);">
      <span class="tracking-wider">MEDNERD ACADEMIC SYSTEM</span>
      <a href="admin.html" class="text-[#1A7398] hover:underline">بوابة المشرف (Admin)</a>
    </div>
  </footer>

  <script>
    const AUTH_CONFIG = {
      REDIRECT_AFTER_LOGIN: "index.html"
    };

    const STORAGE_KEYS = {
      AUTH_USER: "mednerd_auth_user",
      PROFILE: "mednerd_profile",
      USERS_LIST: "mednerd_registered_users_list",
      THEME: "mednerd_theme"
    };

    function applySavedTheme() {
      const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME) || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        btn.textContent = savedTheme === "dark" ? "☀️ الوضع النهاري" : "🌙 الوضع الليلي";
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      const next = current === "dark" ? "light" : "dark";
      localStorage.setItem(STORAGE_KEYS.THEME, next);
      applySavedTheme();
    }

    applySavedTheme();

    // تحويل تلقائي إذا كان المستخدم مسجلاً بالفعل
    (function checkExistingSession() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEYS.AUTH_USER) || "null");
        if (saved && saved.loggedIn && !saved.guest && saved.email) {
          window.location.replace(AUTH_CONFIG.REDIRECT_AFTER_LOGIN);
        }
      } catch (e) {}
    })();

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const nowIso = new Date().toISOString();
      const profileData = {
        name: document.getElementById("userName").value.trim(),
        country: document.getElementById("userCountry").value.trim(),
        email: document.getElementById("userEmail").value.trim().toLowerCase(),
        faculty: document.getElementById("userFaculty").value.trim(),
        level: document.getElementById("userLevel").value,
        role: document.getElementById("userRole").value,
        savedAt: nowIso
      };

      const authData = {
        ...profileData,
        guest: false,
        loggedIn: true,
        authProvider: "direct",
        loginAt: nowIso
      };

      localStorage.setItem(STORAGE_KEYS.PROFILE, JSON.stringify(profileData));
      localStorage.setItem(STORAGE_KEYS.AUTH_USER, JSON.stringify(authData));

      try {
        const list = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS_LIST) || "[]");
        const filtered = list.filter((u) => (u.email || "").toLowerCase() !== profileData.email);
        filtered.push(authData);
        localStorage.setItem(STORAGE_KEYS.USERS_LIST, JSON.stringify(filtered));
      } catch (err) {}

      const box = document.getElementById("alertBox");
      box.className = "mb-5 p-3.5 rounded-l-xl text-xs font-bold leading-relaxed border-y border-l";
      box.style.borderRight = "4px solid #1A7398";
      box.style.backgroundColor = "var(--med-primary-soft)";
      box.style.borderColor = "var(--med-border)";
      box.style.borderRightColor = "#1A7398";
      box.style.color = "var(--med-navy)";
      box.textContent = "تم تسجيل الدخول بنجاح! جاري تحويلك إلى منصة MEDNERD...";

      setTimeout(function () {
        window.location.replace(AUTH_CONFIG.REDIRECT_AFTER_LOGIN);
      }, 350);
    });
  </script>
</body>
</html>
